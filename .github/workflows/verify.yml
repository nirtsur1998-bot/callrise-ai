# M35 Stage 3 — the discipline made mechanical: every push and pull request
# runs the same gate a session runs by hand, scripts/verification/
# verify-green.mjs, which reads the typecheck's own error lines and the
# suite's own summary lines and REFUSES (exit 1) on anything that is not
# green — including a stray "Errors  N error" line beside a passing count
# (taxonomy species 4) and a missing summary (the run did not finish).
#
# Order matters (species 41): the native addon and the renderer/main bundles
# are built BEFORE the tests, so the tests gated on their presence run instead
# of skipping silently; the gate prints the suite's skipped count so a skip
# is visible in the log, never invisible.
#
# The sweeps that need a running app (screen-sweep, occlusion-sweep, the UI
# driver) cannot run here and are not pretended to; see
# scripts/verification/README.md.
name: Verify

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: npm

      # BUG-281 — two install-step failures in four days, both on the runner's
      # network, both green on re-run with no code change: a 504 on a prebuilt
      # binary (2026-09-14) and the Node headers tarball aborting mid-extract
      # while better-sqlite3 fell back to node-gyp (2026-09-17). `cache: npm`
      # above restores the npm cache (prebuilds included) when the lockfile key
      # hits; nothing restored the node-gyp headers, so every compile fallback
      # was a fresh download. This caches them, keyed on the exact Node version
      # setup-node resolved, so a prebuilt miss no longer costs a second fetch.
      #
      # WHAT FILLS IT: not `npm ci` (a prebuilt hit never touches node-gyp) but
      # the native addon build below, which runs node-gyp on EVERY run and so
      # downloads headers into this directory the first time — the ELECTRON
      # headers (electronjs.org/headers/v<electron>/…), because the addon is
      # built against Electron's ABI; the Node headers (nodejs.org) only land
      # here when `npm ci` falls back to compiling a dependency. Both live in
      # the same directory, one subfolder per version. `actions/cache` saves
      # only if the path exists at post-job, so if the addon step is ever
      # removed this cache goes silent — the log line to look for is
      # "Cache saved with key node-gyp-…" on a first run and "Cache restored
      # from key …" plus NO `gyp http GET …headers.tar.gz` on the next
      # (measured 2026-09-17: run 35243375818, attempt 1 saved, attempt 2
      # restored with zero node-gyp downloads).
      #
      # THE KEY carries the lockfile hash because a saved cache is immutable
      # per key: keyed on the Node version alone, an Electron bump would keep
      # restoring the old headers and never save the new ones. `restore-keys`
      # falls back to the newest cache for the same Node version so a lockfile
      # change still starts from the previous headers and saves a superset.
      - name: Cache node-gyp headers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\node-gyp\Cache
          key: node-gyp-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-gyp-${{ runner.os }}-${{ steps.node.outputs.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Build native addon (win-audio-sessions)
        run: npm run native:build:win

      - name: Build renderer/main (electron-vite)
        run: npx electron-vite build

      - name: Gate — typecheck + full suite, read from their own lines
        run: node scripts/verification/verify-green.mjs

      - name: Self-tests of the instruments (they must be able to refuse)
        run: node scripts/verification/verify-green.mjs --tests -- src/__tests__/verify-green.test.ts src/__tests__/tracker-status.test.ts src/__tests__/no-uncollected-test-files.test.ts src/__tests__/frozen-modules-have-no-production-callers.test.ts src/__tests__/packaged-files.test.ts src/__tests__/release-notes.test.ts src/__tests__/protected-instances.test.ts src/__tests__/no-control-bytes-in-source.test.ts
