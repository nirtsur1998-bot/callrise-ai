name: Build Windows demo installer

# One-off / on-demand: builds the real Windows installer on a genuine
# GitHub-hosted Windows runner (real MSVC + Windows SDK, not a cross-compile
# guess), then publishes it as a GitHub Release asset so it can be fetched
# without anyone needing to log into anything (this repo is public).
#
# Restricted to x64 only - that's the architecture actually verified on real
# Windows hardware for this project so far (see docs/detection.md); building
# arm64 too would require cross-arch compilation of the win-audio-sessions
# native addon that has never been attempted or verified.
#
# Steps are split (rather than one big `run:` block) and each captures its
# own log file, so a failure's actual output can be read from the job
# summary - full step logs require a GitHub login even on a public repo, but
# the Summary tab does not.
on:
  push:
    tags:
      - "windows-demo-*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: npm ci > install.log 2>&1

      - name: Build native addon (win-audio-sessions)
        shell: bash
        run: npm run native:build:win > native-build.log 2>&1

      - name: Typecheck
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1

      - name: Build renderer/main (electron-vite)
        shell: bash
        run: npx electron-vite build > vite-build.log 2>&1

      - name: Package installer (electron-builder)
        shell: bash
        run: npx electron-builder --win --x64 > electron-builder.log 2>&1

      - name: Surface failure details in the job summary
        if: failure()
        shell: bash
        run: |
          echo "## Build failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for f in install.log native-build.log typecheck.log vite-build.log electron-builder.log; do
            if [ -f "$f" ]; then
              echo "### $f (last 150 lines)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 150 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Rename installer for the demo
        shell: bash
        run: |
          mv "dist/CallRise AI Windows.exe" "dist/CallRise-AI-DEMO-Windows.exe"
          ls -la dist/*.exe

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CallRise AI - Windows demo build"
          body: "Automated Windows demo build (x64) from commit ${{ github.sha }}. Unsigned - Windows SmartScreen will warn on first run (More info -> Run anyway)."
          files: dist/CallRise-AI-DEMO-Windows.exe
          prerelease: true
