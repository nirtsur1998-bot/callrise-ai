appId: ai.callrise.app
productName: CallRise AI
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo,tsconfig.web.tsbuildinfo}'
  - '!CLAUDE.md'
  - '!docs/**'
  - '!supabase/**'
  - '!.claude/**'
  # BUG-124 — build/test tooling is not the product. Nothing at runtime reads
  # from scripts/ (grep'd 2026-09-05); beforePack/afterPack run from the repo,
  # not from the asar. ~60 KB of our tooling was shipping to every user.
  - '!scripts/**'
  # Stray logs and archives must never be packaged. Beyond bloat, a file that
  # is still being WRITTEN while electron-builder streams the asar corrupts it:
  # the header records the size seen at stat time, the file keeps growing, and
  # every offset after it shifts — so package.json comes back as some other
  # file's bytes and the packaged app dies on startup with a silent exit 1.
  # Redirecting a build log into the repo root is enough to trigger it.
  - '!**/*.log'
  - '!**/*.zip'
  - '!**/*.7z'
  - '!dist{,/**}'
  - '!out/**/*.map'
# Lock the Electron fuses on every packaged binary (see scripts/apply-fuses.js).
# Runs before signing, because flipping a fuse invalidates a signature.
# BUG-117 — the guarantee two comments in this file already claimed.
#
# Both extraResources blocks below say a missing denoiser FAILS the build.
# Neither did: electron-builder only WARNS on a missing extraResources source
# and packages anyway (app-builder-lib/out/fileMatcher.js, copyFiles). Verified
# by renaming build/virtualmic-win/ aside and rebuilding — two warning lines,
# exit code 0, and a complete installable app with no denoiser in it.
#
# This hook throws before any packaging work starts, which is what makes those
# comments true. See scripts/verify-build-inputs.js for the full history.
beforePack: scripts/verify-build-inputs.js
afterPack: scripts/apply-fuses.js

asarUnpack:
  - resources/**
  # mac-audio-activity/win-audio-sessions native addons - a .node binary can't
  # be require()'d from inside an asar archive at all, so without this the
  # packaged app would silently degrade to "detection unavailable" on every
  # install (isSupported() just returns false; see MacAdapter.ts/
  # WindowsAdapter.ts's resolveAddonPath, which checks the mirrored
  # app.asar.unpacked path this produces). Must be built with `npm run
  # native:build:mac`/`:win` BEFORE packaging - build:mac/build:win do this.
  - native/*/build/Release/*.node
  # M25 Sales Brain - better-sqlite3 (npm-installed, not an in-repo addon
  # like the two above) ships its own prebuilt .node binaries directly
  # inside the package (node_modules/better-sqlite3/prebuilds/), rebuilt
  # against Electron's ABI by the existing `electron-builder install-app-
  # deps` postinstall hook - same "can't require() a .node from inside
  # asar" problem as every native addon above, same fix. sqlite-vec ships
  # its platform binary (vec0.dll on Windows) as a SEPARATE optional-
  # dependency package (sqlite-vec-windows-x64 etc.), loaded at runtime via
  # sqlite3_load_extension rather than require()'d as a Node addon - not
  # technically required to unpack for that reason, but unpacked anyway so
  # both halves of the same feature are packaged identically and neither
  # becomes the one exception someone has to remember. This whole file's own
  # history is two separate incidents of a native binary silently breaking
  # on real hardware from a packaging gap exactly like this - launch-test
  # the actual packaged build (not dev mode) any time this block changes.
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec/**
  - node_modules/sqlite-vec-*/**
  # @xenova/transformers (local embeddings) pulls in onnxruntime-node as its
  # Node-side inference backend, which is itself a native addon
  # (onnxruntime-node/bin/napi-v3/<platform>/<arch>/onnxruntime_binding.node)
  # - same asar problem, same fix.
  - node_modules/onnxruntime-node/**

# The Visual C++ runtime, shipped app-locally beside CallRiseAI.exe.
#
# onnxruntime-node's binding (the local-embeddings backend behind Sales
# Brain) statically imports MSVCP140.dll / VCRUNTIME140.dll /
# VCRUNTIME140_1.dll — verified with `dumpbin /dependents` on the exact
# .node we ship, not assumed. Those DLLs are present on every machine with
# Visual Studio installed, which silently includes every dev box AND every
# GitHub Actions windows runner — and ABSENT on a clean Windows install,
# where Windows fails the load with ERROR_MOD_NOT_FOUND, surfaced to the
# user as the bare OS string "The specified module could not be found."
#
# That is a real user-reported failure, not a theoretical one: Sales Brain
# was completely dead on a clean machine while working perfectly on the dev
# machine and passing every CI check, because BOTH environments had the
# runtime and neither could see the dependency. Local testing of the
# packaged app on a developer machine cannot catch this class of bug at all
# — the only honest check is a machine that never had Visual Studio.
#
# These are Microsoft's own redistributable binaries, taken from the VC
# Redist folder that exists specifically to be redistributed with an
# application; app-local deployment beside the .exe is an explicitly
# supported deployment mode. Windows' dependency search always includes the
# application directory, so placing them next to CallRiseAI.exe resolves
# them for the .node regardless of where under resources/ it lives.
extraFiles:
  - from: build/vcruntime
    to: .
    filter:
      - '*.dll'

win:
  executableName: CallRiseAI
  # TIER 1 NOISE CANCELLATION — the engine and its model, shipped together.
  #
  # THIS BLOCK'S ABSENCE WAS A SHIPPED-TO-EVERYONE FAILURE. It lived only
  # under `mac:` (below), so no Windows build ever produced
  # resources/virtualmic-win/ — verified by listing the directory inside a
  # real artifact, not by reading a log. resolveEnginePath() in
  # src/main/tier1.ts therefore found nothing, engineAvailable was false, and
  # Tier 1 was silently absent for every Windows user. It worked on exactly
  # one machine on earth: the dev box, because _bundle_kern_bridge.ps1
  # hardcodes that machine's install path and patches the INSTALLED app in
  # place. A machine patched in place proves nothing about the build.
  #
  # THE MODEL SHIPS HERE, BESIDE THE BINARY, AND THAT IS THE WHOLE POINT.
  # kern_bridge resolves its model beside its own .exe first (ResolveModelPath,
  # kern_bridge.cpp), falling back to C:\ProgramData\CallRiseAI\Models only
  # for continuity with machines that ran the driver installer. Before that
  # change the ProgramData path was the ONLY one, and the only thing that ever
  # wrote there was install-denoiser.ps1 — the elevated DRIVER installer. So a
  # feature whose premise is "no driver required" had its model delivered by
  # the driver installer, and every user who took that premise at face value
  # got df_create failure and silent PASSTHROUGH: engine up, pipe connected,
  # audio flowing, UI reporting clean, nothing denoised.
  #
  # Shipping both files here is what makes "works with no driver" true. Do not
  # drop the model to save the ~8MB: without it this block delivers an engine
  # that runs and cleans nothing, which is worse than shipping neither.
  #
  # If the staging directory is missing at build time this FAILS the build
  # rather than quietly producing an installer without a denoiser — same
  # posture as the mac block, and for the same reason.
  #
  # BUG-117: that sentence was FALSE until the beforePack hook at the top of
  # this file existed. electron-builder warns and ships without these. The
  # guarantee lives in scripts/verify-build-inputs.js — if you add an entry
  # to the extraResources list below, add it there too or the check quietly
  # narrows to whatever it still knows about.
  # SOURCED FROM INSIDE THE REPO, ON PURPOSE. The obvious spelling of this is
  # a sibling-checkout path (`../CALLRISE AI/_virtualmic_win_stage/...`), the
  # way the mac block below reads. That spelling resolves on exactly one
  # machine: the dev box. release.yml builds on a `windows-latest` runner with
  # a plain actions/checkout, where no sibling tree exists — so the published
  # installer would ship with no denoiser while every local build looked
  # perfect. That is the same "works on my machine" failure this whole block
  # exists to fix, just relocated from the deploy script into CI.
  #
  # Committing ~24MB of binaries is a real cost and it is the deliberate
  # trade: the build becomes hermetic and produces byte-identical resources
  # locally and in CI. If this is ever swapped for a fetch step, the fetch
  # must FAIL the build when it cannot get the files — never skip them.
  extraResources:
    - from: build/virtualmic-win/kern_bridge.exe
      to: virtualmic-win/kern_bridge.exe
    - from: build/virtualmic-win/DeepFilterNet3_onnx.tar.gz
      to: virtualmic-win/DeepFilterNet3_onnx.tar.gz
  # The "portable" target was added as a debugging alternative to the NSIS
  # installer, then reportedly confirmed on real hardware to never launch, and
  # was dropped for a time. RESTORED (M21+M20 merge, 2026-08-04): launch-tested
  # directly, twice, on a build made AFTER `da45760` (the asar-corruption fix —
  # a stray file left mid-write in the repo root during packaging silently
  # de-syncs the archive and every packaged target dies with a bare exit 1, no
  # error anywhere). That symptom is indistinguishable from "never launches on
  # real hardware," so the prior "confirmed dead" conclusion was very likely
  # the same asar-corruption bug, not something specific to the portable format.
  # If this regresses again, verify with `npx @electron/asar extract-file
  # app.asar package.json` before concluding the target itself is broken.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: CallRise AI Windows.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Show the installer's directory-choice screen instead of a silent one-click
  # install — clearer for a first-time Windows user installing an unsigned app.
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: CallRise AI Windows Portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: CallRise AI records the other party's call audio, only with their consent, so it can transcribe the conversation.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - dmg
  # The noise-cancellation engine (michelper + DFN3 Standard model + the HAL
  # driver bundle) lives in the separate salesos-virtualmic repo, built as a
  # sibling checkout next to this one. This copies its ALREADY-BUILT output
  # in — it does not build that repo. If that sibling repo isn't present at
  # build time, this step fails loudly (a missing denoiser shouldn't ship
  # silently) — BUG-117: enforced by scripts/verify-build-inputs.js, NOT by
  # electron-builder, which only warns. This mattered most here: nothing in
  # this repo can make the sibling checkout appear, and there is no macOS CI,
  # so before that hook any Mac without it built a silent no-denoiser .dmg. Only the Standard model ships, not the 36MB LL variant this
  # app doesn't use. Layout mirrors what virtualmic.ts's resolveHelperPath /
  # resolveDriverBundleSource expect under resourcesPath/virtualmic/.
  extraResources:
    - from: ../salesos-virtualmic/build/michelper
      to: virtualmic/build/michelper
    - from: ../salesos-virtualmic/build/SalesOSMicrophone.driver
      to: virtualmic/build/SalesOSMicrophone.driver
    - from: ../salesos-virtualmic/phase2/models/DeepFilterNet3_onnx.tar.gz
      to: virtualmic/phase2/models/DeepFilterNet3_onnx.tar.gz
dmg:
  artifactName: CallRise AI Mac (${arch}).${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
# Off everywhere, not just Windows: a real hash mismatch was confirmed on
# Windows hardware (this option genuinely fixed that specific error), but an
# adversarial re-check disproved the original theory of WHY - electron-builder's
# resedit-based exe rewrite was reproduced byte-for-byte and does not corrupt
# anything. The real Windows launch failure turned out to be unrelated (see
# win.target's comment - the portable format itself, never this option).
# Left off regardless: there's no per-platform switch for it, and a fuse that
# says "verify integrity" with no embedded data to check against (which is
# what Mac would get if its own plist-based embed were skipped) fails the
# same way integrity checks always fail when misconfigured.
npmRebuild: false
disableAsarIntegrity: true
# M23: GitHub Releases on the public callrise-ai repo. `electron-builder
# --publish always` (needs a GH_TOKEN with repo scope) creates the release
# and uploads the installers + the latest.yml manifest electron-updater
# reads at runtime — see src/main/updater/index.ts and default-config.ts's
# UPDATE_FEED_URL, which points the RUNNING app at this same repo. No token
# is needed just to check for updates on a public repo, only to publish one.
publish:
  provider: github
  owner: nirtsur1998-bot
  repo: callrise-ai
  # electron-builder defaults releaseType to 'draft', which leaves the
  # release invisible on the public page AND unreachable by the running
  # app's auto-updater (it only reads published releases). v1.0.0 shipped
  # as a silent draft the first time because of this default. NOTE: an
  # earlier fix here used `draft: false` — that property doesn't exist in
  # this electron-builder version's schema (see node_modules/app-builder-lib
  # /scheme.json's GithubOptions — it's `releaseType`, not a boolean
  # `draft`), so every build after that "fix" was actually failing schema
  # validation outright rather than publishing a draft. `release` is the
  # correct value to publish live immediately.
  releaseType: release
